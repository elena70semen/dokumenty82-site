# Separate IP preview, without CRM or analytics. Public release: 0c9a4fa.
server {
    listen 80;
    listen 443 ssl;
    server_name 159.194.223.106;
    ssl_certificate /etc/letsencrypt/live/159.194.223.106/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/159.194.223.106/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/redesight/releases/0c9a4fa;
    index index.html;
    charset utf-8;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://yandex.ru https://yandex.com" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"ok":false,"message":"Preview only"}';
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/redesight-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
